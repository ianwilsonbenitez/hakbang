<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-label="Three labeled variable boxes from top to bottom showing how = stores three kinds of values: shopName = &quot;Sari-Sari&quot; (Text in quotes), itemCount = 12 (Number without quotes), and isOpen = true (True/False switch without quotes).">
  <title>Three labeled variable boxes from top to bottom showing how = stores three kinds of values: shopName = "Sari-Sari" (Text in quotes), itemCount = 12 (Number without quotes), and isOpen = true (True/False switch without quotes).</title>
  <g fill="currentColor" font-family="Inter, system-ui, -apple-system, sans-serif">
    <!-- Top rule banner -->
    <text x="180" y="28" text-anchor="middle" font-size="13" font-weight="600">name = value (stores value inside box)</text>

    <!-- Box 1: Text (string) -->
    <rect x="20" y="46" width="320" height="96" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.75" />
    <text x="180" y="74" text-anchor="middle" font-size="14" font-weight="600" opacity="0.85">1. Text value (in double quotes)</text>
    <text x="180" y="104" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">let shopName = "Sari-Sari"</text>
    <text x="180" y="128" text-anchor="middle" font-size="14" opacity="0.82">label: shopName  and  inside: "Sari-Sari"</text>

    <!-- Box 2: Number -->
    <rect x="20" y="160" width="320" height="96" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.75" />
    <text x="180" y="188" text-anchor="middle" font-size="14" font-weight="600" opacity="0.85">2. Number value (digits, no quotes)</text>
    <text x="180" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">let itemCount = 12</text>
    <text x="180" y="242" text-anchor="middle" font-size="14" opacity="0.82">label: itemCount  and  inside: 12</text>

    <!-- Box 3: True / False (boolean) -->
    <rect x="20" y="274" width="320" height="96" rx="12" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="1.75" />
    <text x="180" y="302" text-anchor="middle" font-size="14" font-weight="600" opacity="0.85">3. True/false value (no quotes)</text>
    <text x="180" y="332" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="600">let isOpen = true</text>
    <text x="180" y="356" text-anchor="middle" font-size="14" opacity="0.82">label: isOpen  and  inside: true</text>
  </g>
</svg>
