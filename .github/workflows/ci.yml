# Runs on GitHub every time code is pushed. It does the same checks Ian runs by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vite 8 needs Node 20.19+ or 22.12+, so we ask for the newest 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # "ci" installs exactly what package-lock.json says, so every run is the same.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
